name: Build & Deploy

on:
  push:
    branches: [main, master]
  schedule:
    # 06:00 UTC daily — refreshes GithubStats build-time fetch (R2 mitigation).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          # Authenticated GitHub API for build-time GithubStats fetch (5,000/hr).
          # Falls back to FALLBACK constant if missing or rate-limited.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          # Giscus comment widget — IDs are public per Giscus design.
          PUBLIC_GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          # Google Search Console verification — token is a public site-ownership
          # proof, not a secret. Set as a repo Variable (not Secret) so it's
          # inlined into the static bundle. Empty values cause the meta tag to
          # be omitted entirely (Base.astro guard).
          PUBLIC_GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION }}
        run: pnpm exec astro build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
